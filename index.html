<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Полевой планировщик безопасности</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Полевой планировщик безопасности</h1>
    </header>

    <nav class="tabs">
        <button data-tab="plan" class="active">План</button>
        <button data-tab="monitoring">Мониторинг</button>
        <button data-tab="prep">Подготовка</button>
        <button data-tab="sources">Источники</button>
    </nav>

    <main>
        <section id="tab-plan" class="tab-panel active">
            <h2>Создание плана</h2>
            <form id="plan-form">
    <div style="margin-bottom: 10px;">
        <label>Название плана:<br>
            <input type="text" id="plan-name" placeholder="Например, Выезд на шашлыки" required>
        </label>
    </div>
    
    <div style="margin-bottom: 10px;">
        <label>Локация (город):<br>
            <input type="text" id="plan-location" placeholder="Санкт-Петербург" required>
        </label>
    </div>

    <div style="margin-bottom: 10px;">
        <label>Дата:<br>
            <input type="date" id="plan-date" required>
        </label>
    </div>

    <div style="margin-bottom: 10px;">
        <label>Тип работ:<br>
            <select id="plan-work">
                <option value="research">Полевые исследования</option>
                <option value="construction">Строительные работы</option>
                <option value="inspection">Осмотр территории</option>
            </select>
        </label>
    </div>

    <div style="margin-bottom: 10px;">
        <label>Условия:<br>
            <select id="plan-conditions">
                <option value="forest">Лес</option>
                <option value="city">Город</option>
                <option value="industrial">Промзона</option>
            </select>
        </label>
    </div>

    <button type="button" id="save-plan" style="background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px;">Сохранить план</button>
</form>
        </section>

        <section id="tab-monitoring" class="tab-panel">
            <h2>Мониторинг погоды</h2>
            <p>Здесь будет погода.</p>
        </section>

        <section id="tab-prep" class="tab-panel">
            <h2>Чек-лист подготовки</h2>
            <p>Здесь будет чек-лист.</p>
        </section>

        <section id="tab-sources" class="tab-panel">
            <h2>Источники и памятки</h2>
            <p>Здесь будет памятка по задымлению.</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
